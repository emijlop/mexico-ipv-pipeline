# DGIS "Lesiones y causas de violencia" (SINBA-SEUL-17) - codes used by src/filter/dgis.py.
# VERIFIED on 2026-11-27 against data/raw/dgis/2024/instructivo/Instructivo_Lesiones_2024.pdf
# (version 1.7, Dec 2023) and against the value distributions in Lesiones_2024.zip (D_Evento.txt).
# If a new year's manual changes a code, add a year-specific block rather than editing these.

sexo:                      # SEXO, manual p.23
  mujer: "2"
cveedad:                   # CVEEDAD = unit of Edad. NOT in the manual; inferred from the data:
  anios: "5"               #   5 -> Edad 1-120 (years); 4 -> 1-11 (months); 3 -> 1-29 (days);
  desconocida: "9"         #   2 -> 1-23 (hours); 9 -> Edad 999 (unknown, manual p.34)
  menos_de_un_anio: ["2", "3", "4"]   # hours, days, months -> always under 15
edad_desconocida: "999"
intencionalidad:           # CodIntencionalidad, manual p.26 / p.39
  violencia_familiar: "2"
  violencia_no_familiar: "3"
parentesco:                # CodParentescoAgresor, manual p.28
  pareja: "3"              # "Cónyuge/Pareja/Novia(o)"
  no_especificado: ["0", "-1"]   # -1 = blank (not a violence record or not filled)
  # 10 appears 24 times in 2024 but is not in the manual -> treated as 'other relative'
aviso_mp:                  # CodMP "Se dio aviso al Ministerio Público", manual p.31
  si: "1"
tipo_violencia:            # D_TipoViolencia.CodTipoViolencia, manual p.28 (several per record)
  fisica: "6"
  sexual: "7"
  psicologica: "8"
  economica_patrimonial: "9"
  abandono_negligencia: "10"
# State = state of the health unit, from the first two letters of CLUES (where the
# institution recorded the case). CodEstado (state of residence/occurrence) has 00/99
# codes for ~3% of records, so it is kept only as a check.
clues_estado:
  AS: "01"
  BC: "02"
  BS: "03"
  CC: "04"
  CL: "05"
  CM: "06"
  CS: "07"
  CH: "08"
  DF: "09"
  DG: "10"
  GT: "11"
  GR: "12"
  HG: "13"
  JC: "14"
  MC: "15"
  MN: "16"
  MS: "17"
  NT: "18"
  NL: "19"
  OC: "20"
  PL: "21"
  QT: "22"
  QR: "23"
  SP: "24"
  SL: "25"
  SR: "26"
  TC: "27"
  TS: "28"
  TL: "29"
  VZ: "30"
  YN: "31"
  ZS: "32"
